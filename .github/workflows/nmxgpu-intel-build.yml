name: NMXGPU Intel (i915) kext build

# Manual only: a full run compiles about 1,250 sources. Result: a build summary on the run page, the logs, and
# NMXGPU.kext when the link works. Run it on a fork of this repository: Actions > this workflow > Run workflow.
on:
  workflow_dispatch:
    inputs:
      min_os:
        description: macOS deployment target of the kext (14.0 = Sonoma)
        default: "14.0"
      drm_kmod_ref:
        description: freebsd/drm-kmod branch, tag or commit
        default: c16de0f9fa84f70b9551f69fde837a7f3a73c0e9
      freebsd_ref:
        description: freebsd/freebsd-src branch, tag or commit (LinuxKPI headers)
        default: b42793d4bcdf73475b77a26c9dbacd45f8876621
      no_xe:
        description: "1 = leave the xe driver out (Tiger Lake and older use i915); empty = build it too (needs Linux 6.14 sources, not fetched here)"
        default: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]   # one runner: half the Actions minutes (10-19)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Build NMXGPU.kext (Intel)
        env:
          NMX_MIN_OS: ${{ inputs.min_os }}
          DRM_KMOD_REF: ${{ inputs.drm_kmod_ref }}
          FREEBSD_REF: ${{ inputs.freebsd_ref }}
          NMX_NO_XE: ${{ inputs.no_xe }}
        run: bash gpu-port/xkpi/ci-build-intel.sh "$RUNNER_TEMP/nmx"

      # b97: the Metal plugin (plugin/, one translation unit) built here too, as build/build_plugin.sh does on the
      # build Mac. A failure here does not fail the kext build; the plugin lands in out/NVMTLDriver.bundle.
      - name: Build NVMTLDriver (Metal plugin)
        if: always()
        continue-on-error: true
        run: |
          set -e
          O="$RUNNER_TEMP/nmx/out"; mkdir -p "$O" "$RUNNER_TEMP/nmx/ci"
          git clone -q --depth 1 https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/vkh"
          cd plugin
          # b190 (speed / heat): the plugin a user installs is the QUIET build (-DNVMTL_RELEASE=1): only failures reach
          # the log. The verbose build wrote every nvlog line to syslog AND to a file - in WindowServer with an fsync
          # per line - in every Metal process. The verbose one is still built, for diagnosis: out/debug/NVMTLDriver.bundle
          # b231 (speed): the quiet build is optimised harder (-O2, was -O1; -fno-strict-aliasing keeps the many pointer casts
          # between Metal/Vulkan structs safe). The verbose debug build stays at -O1: if the quiet one misbehaves, the debug
          # one is the known-good comparison.
          build_one() {  # $1 bundle dir, $2 extra flags, $3 label
            B="$1/Contents/MacOS"; mkdir -p "$B"
            xcrun clang -arch x86_64 -bundle -fobjc-arc -mmacosx-version-min=14.0 $2 -Wno-protocol -Wno-incomplete-implementation \
              -I"$RUNNER_TEMP/vkh/include" -o "$B/NVMTLDriver" NVMTLDevice.m \
              -framework Foundation -framework Metal -framework IOSurface -framework IOKit -framework QuartzCore \
              2> "$RUNNER_TEMP/nmx/ci/NVMTLDriver-$3.err" || { grep -A3 ': error:' "$RUNNER_TEMP/nmx/ci/NVMTLDriver-$3.err" | head -60; return 1; }
            codesign -f -s - "$B/NVMTLDriver"
            echo "NVMTLDriver ($3): $(stat -f %z "$B/NVMTLDriver") bytes, uuid $(otool -l "$B/NVMTLDriver" | awk '/uuid/{print $2; exit}')"
            echo "### NVMTLDriver $3 built ($(stat -f %z "$B/NVMTLDriver") bytes)" >> "$GITHUB_STEP_SUMMARY"
          }
          build_one "$O/NVMTLDriver.bundle" "-O2 -fno-strict-aliasing -DNVMTL_RELEASE=1" quiet
          build_one "$O/debug/NVMTLDriver.bundle" "-O1" verbose

      # b203: the small installer app ("IrisXe Manager.app") lands in out/ next to the kexts and the plugin
      - name: Build IrisXe Manager (installer app)
        if: always()
        continue-on-error: true
        run: |
          bash manager/build.sh "$RUNNER_TEMP/nmx/out"
          echo "### IrisXe Manager.app built" >> "$GITHUB_STEP_SUMMARY"

      # b155: the shader translator (Rust) built here too, so a translator fix needs no Mesa build. It lands in
      # out/nvmtl/libnvmtl_translate.dylib - install with tools/macos-helpers/nmx-xlate-update.sh.
      - name: Build shader translator (libnvmtl_translate.dylib)
        if: always()
        continue-on-error: true
        run: |
          set -e
          command -v cargo >/dev/null || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null; . "$HOME/.cargo/env"; }
          O="$RUNNER_TEMP/nmx/out/nvmtl"; mkdir -p "$O" "$RUNNER_TEMP/nmx/ci"
          # b156: the runners are Apple Silicon - build for x86_64 explicitly (b155's arm64 dylib could not load:
          # "incompatible architecture", WindowServer had no translator and restarted in a loop at login)
          rustup target add x86_64-apple-darwin
          MACOSX_DEPLOYMENT_TARGET=14.0 cargo build --release --target x86_64-apple-darwin \
            --manifest-path translator/wrapper/Cargo.toml --target-dir "$RUNNER_TEMP/xlate-target" \
            > "$RUNNER_TEMP/nmx/ci/cargo.log" 2>&1 || { grep -E "^error" -A6 "$RUNNER_TEMP/nmx/ci/cargo.log" | head -60; exit 1; }
          cp "$RUNNER_TEMP/xlate-target/x86_64-apple-darwin/release/libnvmtl_translate.dylib" "$O/"
          lipo -archs "$O/libnvmtl_translate.dylib" | grep -qx x86_64 || { echo "NOT x86_64: $(lipo -archs "$O/libnvmtl_translate.dylib")"; exit 1; }
          install_name_tool -id @rpath/libnvmtl_translate.dylib "$O/libnvmtl_translate.dylib"
          strip -S "$O/libnvmtl_translate.dylib"; codesign -f -s - "$O/libnvmtl_translate.dylib"
          cp tools/macos-helpers/nmx-xlate-update.sh "$O/"
          echo "### libnvmtl_translate.dylib built ($(stat -f %z "$O/libnvmtl_translate.dylib") bytes)" >> "$GITHUB_STEP_SUMMARY"

      # b104 (Phase 4): the Metal test programs, so app-path tests need no Xcode on the Mac. The plugin always gives
      # these names a device. mtlwindow = a window with a CAMetalLayer: the same path an app's frames take to the screen.
      - name: Build Metal test tools (mtlprobe, mtldraw, mtlwindow)
        if: always()
        continue-on-error: true
        run: |
          set -e
          T="$RUNNER_TEMP/nmx/out/metal-tests"; mkdir -p "$T"
          M="xcrun clang -arch x86_64 -fobjc-arc -O1 -mmacosx-version-min=14.0"
          $M tools/metal/mtlprobe.m  -framework Foundation -framework Metal -o "$T/mtlprobe"
          $M tools/metal/mtldraw.m   -framework Foundation -framework Metal -framework CoreGraphics -framework ImageIO -o "$T/mtldraw"
          $M tools/metal/mtlwindow.m -framework Foundation -framework AppKit -framework Metal -framework QuartzCore -o "$T/mtlwindow"
          for f in "$T"/*; do codesign -f -s - "$f"; done
          cp tools/macos-helpers/nmx-app-gpu.sh "$T/"
          echo "### Metal test tools built: $(ls "$T" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and kext
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmxgpu-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/nmx/ci
            ${{ runner.temp }}/nmx/out
          if-no-files-found: warn
